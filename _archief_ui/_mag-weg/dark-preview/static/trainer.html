<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CBR Setup Trainer — Fase 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --bg:#f7f4ef; --surface:#fff; --surface-2:#efebe3;
  --text:#181c25; --text-2:#4a5263; --text-3:#868f9f;
  --border:#ddd7cd; --border-2:#e8e3da;
  --bull:#0d9668; --bear:#dc2f4e; --shift:#6d4dea; --entry:#b07d05;
  --ok-bg:rgba(13,150,104,.06); --no-bg:rgba(220,47,78,.055); --shift-bg:rgba(109,77,234,.06);

  /* jouw TradingView — vast in beide thema's */
  --tv-bg:#ffffff; --tv-grid:#e9ecf2; --tv-axis:#9aa1b0; --tv-text:#131722;
  --tv-up:#2962ff; --tv-down:#0b0e11;
  --tv-level:#131722; --tv-fib:#089981; --tv-sep:#f23645; --tv-draw:#6d4dea;
  --r:11px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e13; --surface:#141822; --surface-2:#1a1f2a;
    --text:#e3e6ed; --text-2:#98a2b5; --text-3:#606a7c;
    --border:#1f2531; --border-2:#1a1f2a;
    --bull:#16c095; --bear:#ff5570; --shift:#a78bfa; --entry:#eab308;
    --ok-bg:rgba(22,192,149,.08); --no-bg:rgba(255,85,112,.08); --shift-bg:rgba(167,139,250,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#141822; --surface-2:#1a1f2a;
  --text:#e3e6ed; --text-2:#98a2b5; --text-3:#606a7c;
  --border:#1f2531; --border-2:#1a1f2a;
  --bull:#16c095; --bear:#ff5570; --shift:#a78bfa; --entry:#eab308;
  --ok-bg:rgba(22,192,149,.08); --no-bg:rgba(255,85,112,.08); --shift-bg:rgba(167,139,250,.08);
}

*{box-sizing:border-box}
body{
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text);
  padding-inline:16px; padding-block:22px 60px; margin:0; line-height:1.55;
}
.page{max-width:620px;margin:0 auto}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ── kop ── */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-size:clamp(22px,5.5vw,28px);font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.15}
h1 .a{color:var(--shift)}
.score{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--text-3);white-space:nowrap}
.score b{color:var(--bull);font-weight:700}
.lead{font-size:14px;color:var(--text-2);margin:0 0 14px}

/* ── voortgang ── */
.bar{display:flex;gap:3px;margin-bottom:16px}
.pip{flex:1;height:4px;border-radius:2px;background:var(--border)}
.pip.ok{background:var(--bull)} .pip.no{background:var(--bear)} .pip.now{background:var(--shift)}

/* ── scenariokop ── */
.scen{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.scen .n{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;
  color:var(--shift);background:var(--shift-bg);padding:3px 8px;border-radius:5px;
}
.scen .t{font-size:15px;font-weight:600;flex:1;min-width:0}
.scen .k{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:700;
  color:var(--text-2);background:var(--surface-2);padding:3px 9px;border-radius:5px;
  border:1px solid var(--border-2);
}

/* ── contextbalk: wat je vóór de sessie al wist ── */
.ctx{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.ctx-r{display:flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--border);border-radius:100px;padding:5px 11px}
.ctx-k{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;
  color:var(--text-3);letter-spacing:.03em}
.ctx-v{font-size:11.5px;font-weight:700}
.ctx-v.bull{color:var(--bull)} .ctx-v.bear{color:var(--bear)}
.ctx-v.warn{color:var(--entry)} .ctx-v.no{color:var(--bear)}
.ctx-v.ok{color:var(--text-2);font-weight:500}
.fb-poort{font-size:13px;color:var(--text-2);margin:0 0 9px;padding:8px 11px;
  border-radius:7px;background:var(--surface-2);line-height:1.5}
.fb-poort b{color:var(--shift)}

/* ── chart ── */
.chart{
  background:var(--tv-bg);border:1px solid var(--border);
  border-radius:var(--r);padding:6px 4px 2px;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.chart svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hint{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  color:var(--tv-draw);margin:-8px 0 12px;min-height:15px;
}

/* ── tekengereedschap ── */
.tools{
  display:flex;gap:5px;margin-bottom:10px;
  overflow-x:auto;padding-bottom:3px;scrollbar-width:none;
}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;white-space:nowrap}
.tool{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;
  padding:6px 11px;border-radius:100px;cursor:pointer;
  background:var(--surface);color:var(--text-2);
  border:1px solid var(--border);transition:all .14s ease;
}
.tool:hover{border-color:var(--shift)}
.tool.on{background:var(--shift);border-color:var(--shift);color:#fff}
.tool.wis{color:var(--text-3)}
.tool:focus-visible{outline:2px solid var(--shift);outline-offset:2px}

/* ── beslissing ── */
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.act{
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;letter-spacing:.01em;
  padding:15px 6px;border-radius:9px;cursor:pointer;border:2px solid transparent;
  transition:transform .1s ease,opacity .14s ease;
}
.act:active{transform:scale(.97)}
.act:disabled{opacity:.35;cursor:default}
.act.buy{background:var(--tv-up);color:#fff}
.act.sell{background:var(--tv-down);color:#fff}
.act.wait{background:transparent;color:var(--shift);border-color:var(--shift)}
.act:focus-visible{outline:2px solid var(--shift);outline-offset:3px}

/* ── feedback ── */
.fb{border-radius:var(--r);padding:18px;margin-bottom:14px}
.fb.ok{background:var(--ok-bg);border-left:3px solid var(--bull)}
.fb.no{background:var(--no-bg);border-left:3px solid var(--bear)}
.fb-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.fb-v{font-size:17px;font-weight:700}
.fb.ok .fb-v{color:var(--bull)} .fb.no .fb-v{color:var(--bear)}
.fb-a{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;
  color:var(--text-3);
}
.fb p{font-size:14px;color:var(--text-2);margin:0;line-height:1.6}
.fb .ref{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;
  color:var(--text-3);display:block;margin-top:10px;
}

.next{
  width:100%;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;
  padding:15px;border-radius:9px;cursor:pointer;border:none;
  background:var(--shift);color:#fff;
}
.next:active{transform:scale(.99)}
.next.drill{background:transparent;color:var(--shift);border:2px solid var(--shift)}

/* ── slot ── */
.done{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:26px 22px}
.done h2{font-size:20px;font-weight:700;margin:0 0 4px}
.done .big{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:44px;font-weight:700;line-height:1;margin:14px 0 6px;color:var(--shift);
}
.done p{font-size:14px;color:var(--text-2);margin:0 0 12px;line-height:1.6}
.done .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.done .cell{background:var(--surface-2);border-radius:8px;padding:12px 14px}
.done .cell .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.done .cell .v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px;font-weight:700}
.note{
  background:var(--shift-bg);border-left:3px solid var(--shift);
  border-radius:8px;padding:14px 16px;font-size:13.5px;color:var(--text-2);line-height:1.55;
}
.note b{color:var(--shift)}

@media(max-width:400px){
  .act{font-size:13px;padding:14px 4px}
  .tool{font-size:10.5px;padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="page">

  <div class="top">
    <h1>Setup <span class="a">Trainer</span></h1>
    <div class="score mono" id="score">0 / 0</div>
  </div>
  <p class="lead">Tien charts uit negenenvijftig. De balk boven de chart is wat je vóór de sessie al wist — kijk daar eerst, niet naar de candles.</p>

  <div class="bar" id="bar"></div>

  <div id="game">
    <div class="scen">
      <span class="n mono" id="num">01</span>
      <span class="t" id="titel">—</span>
      <span class="k mono" id="klok">—</span>
    </div>

    <div class="ctx" id="ctx"></div>
    <div class="chart" id="chart"></div>

    <div class="tools" id="tools">
      <button class="tool" data-t="bos">BOS</button>
      <button class="tool" data-t="ext">Extension</button>
      <button class="tool" data-t="fib">50% retrace</button>
      <button class="tool" data-t="fibbos">50% op BOS</button>
      <button class="tool wis" data-t="wis">wissen</button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="acts">
      <button class="act buy"  data-a="buy">BUY</button>
      <button class="act sell" data-a="sell">SELL</button>
      <button class="act wait" data-a="wait">WAIT OUT</button>
    </div>

    <div id="fbhost"></div>
  </div>

  <div id="einde" hidden></div>
</div>

<script>
(function(){
/* ═══════════ scenario's — allemaal terug te voeren op je eigen week ═══════════
   c     = candles tot het beslismoment   [open, high, low, close]
   na    = wat er daarna gebeurde (wordt pas onthuld na je antwoord)
   lvl   = vorige 1hr high of low
   swing = het swingpunt dat wel/niet gebroken wordt
   f50   = het 50%-niveau van de shift (null als er geen shift is)         */

var S=[
{n:'Bearish A-setup', tijd:'11:23', bias:'bearish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr high', sep:4, swing:97, f50:98.2, ans:'sell',
 c:[[88,90,87,89.5],[89.5,92,89,91.5],[91.5,94,91,93.5],[93.5,96,93,95.5],
    [95.5,98.5,95,98],[98,101.5,97.8,101],[101,103.5,100.5,103],[103,104.2,102,102.5],
    [102.5,103,99.5,100],[100,100.5,97,97.5],[97.5,99,97.2,98.8],
    [98.8,101.5,98.5,101.2],[101.2,102.2,100.5,101],
    [101,101.3,98,98.3],[98.3,98.5,95,95.3],[95.3,96,94.2,94.5],
    [94.5,96.5,94.4,96.2],[96.2,98.4,96,98.2]],
 na:[[98.2,98.4,95.5,95.8],[95.8,96,93,93.3],[93.3,93.5,90.5,91],[91,91.2,88.9,89.1]],
 why:'Alle zes poorten groen. Prijs brak boven de vorige 1hr high, zette een swing low neer, maakte daarna een lager hoog, en sloot met een body ónder die swing low — dat is de shift. De retrace kwam netjes terug op 50% van de shift-beweging. Dit is je A-setup: hier hoor je te verkopen.',
 ref:'Zelfde structuur als trade 18'},

{n:'Range', tijd:'11:14', bias:'bearish', dxy:'invers', rebal:false, lvl:102, lvlL:'vorige 1hr high', sep:3, swing:null, f50:null, ans:'wait',
 c:[[92,94,91.5,93.5],[93.5,96,93,95.5],[95.5,98,95,97.5],[97.5,100.5,97,100.2],
    [100.2,101,99.8,100.5],[100.5,100.9,98.2,98.6],
    [98.6,100.6,98.4,100.2],[100.2,100.8,99,99.4],
    [99.4,99.8,96.6,97],[97,99.4,96.8,99],
    [99,100.7,98.7,100.3],[100.3,100.9,98.9,99.3],
    [99.3,99.7,97.2,97.6],[97.6,99.6,97.4,99.2]],
 na:[[99.2,100.4,98.8,99.5],[99.5,99.9,97.5,97.9],[97.9,99.8,97.7,99.4],[99.4,100.2,98.5,98.9]],
 why:'De vorige 1hr high is nooit geraakt — poort 2 staat al op rood. En binnen de beweging wordt geen enkel swingpunt met een close gebroken: elke dip wordt meteen teruggekocht. Dit is een range waarin de prijs heen en weer kaatst, geen shift. Je zou de onderkant van een range verkopen.',
 ref:'Dit is trade 17 · −5,47'},

{n:'Bullish A-setup', tijd:'11:36', bias:'bullish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr low', sep:4, swing:103, f50:102, ans:'buy',
 c:[[112,113,111,111.5],[111.5,112,109,109.5],[109.5,110,107,107.5],[107.5,108,104.5,105],
    [105,105.5,101.5,102],[102,102.5,98.5,99],[99,99.5,96.5,97],[97,98,95.8,97.5],
    [97.5,100.5,97.3,100],[100,103,99.8,102.5],[102.5,102.8,101,101.3],
    [101.3,101.5,98.5,98.8],[98.8,99.5,97.8,99.2],
    [99.2,102,99,101.8],[101.8,105.5,101.5,105.2],[105.2,106.2,104.5,105.5],
    [105.5,105.7,103,103.4],[103.4,103.6,101.8,102]],
 na:[[102,104.5,101.9,104.2],[104.2,106.5,103.8,106.2],[106.2,109,106,108.7],[108.7,111.6,108.4,111.2]],
 why:'Precies de spiegeling. Sweep onder de vorige 1hr low, de bounce zet een swing high neer, de pullback blijft boven de sweep-low, en dan sluit een body bóven die swing high. Retrace terug naar 50% van de shift. Alles bevestigd — dit is een koop.',
 ref:'De bullish variant uit de guide'},

{n:'Overextensie zonder BoS', tijd:'11:41', bias:'bearish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr high', sep:3, swing:null, f50:null, ans:'wait',
 c:[[94,96,93.5,95.5],[95.5,97.5,95,97],[97,99,96.5,98.5],[98.5,100.8,98.2,100.4],
    [100.4,102,100,101.6],[101.6,102.4,100.9,102.1],
    [102.1,103.3,101.6,102.8],[102.8,103.1,101.9,102.4],
    [102.4,104,102.1,103.6],[103.6,104.2,102.9,103.3],
    [103.3,104.6,103,104.2],[104.2,104.8,103.5,104],
    [104,105.3,103.8,104.9]],
 na:[[104.9,106.2,104.6,105.8],[105.8,107,105.2,106.6],[106.6,107.4,105.9,106.3],[106.3,108,106,107.6]],
 why:'De extensie is er wel: prijs brak boven de vorige 1hr high. Maar er wordt geen swing low gevormd die daarna gebroken wordt — je ziet alleen kleine pauzes in een trend die gewoon doorloopt. Poort 2 groen, poort 4 rood. En kijk waar de prijs daarna heen ging.',
 ref:'Dit is trade 20 · −7,15, je duurste van de week'},

{n:'Wick door het niveau', tijd:'11:19', bias:'bearish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr high', sep:4, swing:97, f50:null, ans:'wait',
 c:[[89,91,88,90.5],[90.5,93,90,92.5],[92.5,96,92,95.5],[95.5,98.5,95,98],
    [98,101,97.7,100.6],[100.6,103,100.2,102.6],[102.6,103.6,101.8,102.2],
    [102.2,102.6,99.4,99.8],[99.8,100.2,97,97.4],
    [97.4,99.2,97.2,98.9],[98.9,101.2,98.6,100.8],[100.8,101.4,99.6,100],
    [100,100.3,97.6,98],[98,98.3,96.2,97.8]],
 na:[[97.8,99.6,97.6,99.2],[99.2,100.8,99,100.4],[100.4,101.6,100.1,101.2],[101.2,102.4,100.8,102]],
 why:'Kijk naar de laatste candle vóór je beslissing: de wick ging wél door de swing low heen, maar de body sloot er weer bóven. Dat is een test die onmiddellijk is teruggekocht — het tegenovergestelde van wat je wil zien. Een wick is geen break; er moet een candle achter dat niveau sluiten.',
 ref:'De regel uit "De break moet écht zijn"'},

{n:'Shift zonder overextensie', tijd:'11:28', bias:'bearish', dxy:'invers', rebal:false, lvl:106, lvlL:'vorige 1hr high', sep:3, swing:97.4, f50:null, ans:'wait',
 c:[[93,95,92.5,94.5],[94.5,97,94,96.5],[96.5,99,96,98.5],[98.5,101,98,100.6],
    [100.6,102.8,100.2,102.4],[102.4,103.2,101.6,102],
    [102,102.4,99.2,99.6],[99.6,100,97.4,97.8],
    [97.8,99.6,97.6,99.2],[99.2,101,98.9,100.6],[100.6,101.2,99.4,99.8],
    [99.8,100.1,97.2,97.6],[97.6,97.9,95.4,95.8]],
 na:[[95.8,97.8,95.6,97.4],[97.4,99.6,97.2,99.2],[99.2,101.8,99,101.4],[101.4,104,101.1,103.6],[103.6,106.2,103.3,105.8]],
 why:'De shift zelf is perfect: swing low, lager hoog, harde body-close eronder. Maar de vorige 1hr high is nooit geraakt — er ligt dus nog onaangeroerde liquiditeit bóven je. En precies daar ging de prijs naartoe. Dit is de duurste soort fout, want technisch zie je hem goed.',
 ref:'Dit is trade 16 · −4,71 — geen vorige candle break = geen trade'},

{n:'Bearish setup, retrace compleet', tijd:'11:33', bias:'bearish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr high', sep:2, swing:99, f50:98.4, ans:'sell',
 c:[[95,96.5,94.5,96],[96,98,95.6,97.6],[97.6,100.4,97.2,100],[100,102.6,99.7,102.2],
    [102.2,105.4,101.9,105],[105,105.8,103.6,104],
    [104,104.4,101,101.4],[101.4,101.8,99,99.4],
    [99.4,101.6,99.2,101.2],[101.2,102.4,100.6,101],
    [101,101.3,98.4,98.8],[98.8,99.1,96.4,96.8],
    [96.8,97.2,94.4,94.8],[94.8,98.6,94.6,98.4]],
 na:[[98.4,98.6,95.8,96.2],[96.2,96.5,93.6,94],[94,94.3,91.4,91.8],[91.8,92.1,89.2,89.6]],
 why:'Diepe extensie voorbij de vorige 1hr high, een duidelijke swing low, een lager hoog, en dan een scherpe body-close onder dat swingpunt. De retrace liep terug tot 50% van de shift-beweging. Poort 1 tot en met 6 allemaal groen. Als je hier "wait" drukte: dit is precies de setup waar je op wacht, dus die moet je nemen.',
 ref:'Een A-setup met een diepere sweep'},

{n:'Geen retrace', tijd:'11:47', bias:'bearish', dxy:'invers', rebal:false, lvl:100, lvlL:'vorige 1hr high', sep:3, swing:98.2, f50:97.4, ans:'wait',
 c:[[90,92,89.5,91.5],[91.5,94,91,93.5],[93.5,96.5,93,96],[96,99,95.6,98.6],
    [98.6,101.4,98.2,101],[101,103.8,100.6,103.4],[103.4,104.4,102.4,102.8],
    [102.8,103.2,100.2,100.6],[100.6,101,98.2,98.6],
    [98.6,100.4,98.4,100],[100,101.6,99.6,101.2],
    [101.2,101.5,98.8,99.2],[99.2,99.5,96.6,97],
    [97,97.1,94.8,95.2],[95.2,95.4,93.2,93.6]],
 na:[[93.6,93.9,91.4,91.8],[91.8,92,89.6,90],[90,90.3,88,88.4],[88.4,88.7,86.6,87]],
 why:'De setup klopt helemaal: extensie, swing low, body-close eronder. Maar er is geen retrace naar 50% geweest — prijs liep meteen door. Zonder retrace moet je je entry gokken en wordt je RR fors slechter. Ja, hij liep door zonder jou, en ja, dat voelt rot. Het blijft de juiste keuze.',
 ref:'Dit is trade 19 — de trade die je bewust liet lopen'},

function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}

/* ═══════════ chart ═══════════ */
var W=440,H=274,PL=8,PR=54,PT=14,PB=18,VH=26,VG=8;
var gold=function(p){ return 4390+(p-100)*3; };

var host=document.getElementById('chart');
var st={i:0,score:0,res:[],wrong:[],drill:false,tool:null,pend:null,draws:[],locked:false,geo:null};

function build(s,shown){
  var all=s.c.concat(s.na), v=[];
  all.forEach(function(k){v.push(k[1],k[2]);}); v.push(s.lvl);
  if(s.tgt!=null) v.push(s.tgt);
  var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v), pd=(hi-lo)*.12;
  lo-=pd; hi+=pd;
  var n=all.length, pw=W-PL-PR, ph=H-PT-PB-VH-VG, RE=PL+pw;
  var Y=function(p){return PT+(hi-p)/(hi-lo)*ph;};
  var P=function(y){return hi-(y-PT)/ph*(hi-lo);};
  var stp=pw/n, X=function(i){return PL+stp*(i+.5);};
  var bw=Math.min(stp*.62,9);
  st.geo={Y:Y,P:P,X:X,PL:PL,RE:RE,PT:PT,ph:ph,lo:lo,hi:hi};

  var o=[];
  /* gridlijnen + prijsas */
  var ticks=5;
  for(var t=0;t<=ticks;t++){
    var p=lo+(hi-lo)*t/ticks, y=Y(p);
    o.push('<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+RE+'" y2="'+y.toFixed(1)+'" stroke="var(--tv-grid)" stroke-width="1"/>');
    o.push('<text x="'+(RE+5)+'" y="'+(y+3.2).toFixed(1)+'" class="cl" fill="var(--tv-axis)" font-size="8.5">'+gold(p).toFixed(1)+'</text>');
  }
  /* uur-separator */
  if(s.sep!=null){
    var sx=X(s.sep)-stp/2;
    o.push('<line x1="'+sx.toFixed(1)+'" y1="'+PT+'" x2="'+sx.toFixed(1)+'" y2="'+(PT+ph)+'" stroke="var(--tv-sep)" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>');
  }
  /* vorige 1hr niveau */
  o.push('<line x1="'+PL+'" y1="'+Y(s.lvl).toFixed(1)+'" x2="'+RE+'" y2="'+Y(s.lvl).toFixed(1)+'" stroke="var(--tv-level)" stroke-width="1.1" stroke-dasharray="5 4"/>');
  var lblY=Y(s.lvl)-5, lblW=s.lvlL.length*4.9+6;

  o.push('<g id="reveal"></g><g id="udraw"></g>');

  /* candles */
  for(var i=0;i<n;i++){
    var k=all[i], up=k[3]>=k[0], col=up?'var(--tv-up)':'var(--tv-down)';
    var bt=Y(Math.max(k[0],k[3])), bb=Y(Math.min(k[0],k[3]));
    var vis=(i<shown)?1:0;
    o.push('<g class="cd" data-i="'+i+'" style="opacity:'+vis+'">'+
      '<line x1="'+X(i).toFixed(1)+'" y1="'+Y(k[1]).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y2="'+Y(k[2]).toFixed(1)+'" stroke="'+col+'" stroke-width="1.1"/>'+
      '<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+bt.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bb-bt,1.2).toFixed(1)+'" fill="'+col+'"/></g>');
  }
  /* volume delta — afgeleid van de body, tenzij het scenario iets anders voorschrijft */
  var vz=PT+ph+VG+VH/2, mx=0, mag=[];
  for(var q=0;q<n;q++){ var m=(s.vol&&s.vol[q]!=null)?s.vol[q]:Math.abs(all[q][3]-all[q][0]); mag.push(m); if(m>mx) mx=m; }
  if(mx<=0) mx=1;
  o.push('<line x1="'+PL+'" y1="'+vz+'" x2="'+RE+'" y2="'+vz+'" stroke="var(--tv-grid)" stroke-width="1"/>');
  for(var q2=0;q2<n;q2++){
    var upv=all[q2][3]>=all[q2][0], h2=Math.max(mag[q2]/mx*(VH/2-1),1);
    var vis2=(q2<shown)?1:0;
    o.push('<rect class="vb" data-i="'+q2+'" style="opacity:'+vis2+'" x="'+(X(q2)-bw/2).toFixed(1)+
      '" y="'+(upv?vz-h2:vz).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h2.toFixed(1)+
      '" fill="'+(upv?'var(--tv-fib)':'var(--tv-sep)')+'" opacity="'+(vis2?'.85':'0')+'"/>');
  }
  o.push('<rect x="'+(PL+1)+'" y="'+(lblY-7.5).toFixed(1)+'" width="'+lblW.toFixed(1)+'" height="10" fill="var(--tv-bg)"/>'+
         '<text x="'+(PL+4)+'" y="'+lblY.toFixed(1)+'" class="cl" fill="var(--tv-level)" font-size="8.5">'+s.lvlL+'</text>');
  o.push('<rect id="hit" x="'+PL+'" y="'+PT+'" width="'+pw+'" height="'+ph+'" fill="transparent" style="cursor:crosshair"/>');

  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Oefenchart, scenario '+(st.i+1)+'">'+o.join('')+'</svg>';
  host.querySelectorAll('text').forEach(function(t){t.setAttribute('font-family',"'JetBrains Mono',ui-monospace,monospace");});
  host.querySelector('#hit').addEventListener('pointerdown',tap);
}

/* ═══════════ tekenen ═══════════ */
function tap(e){
  if(!st.tool||st.tool==='wis') return;
  var svg=host.querySelector('svg'), r=svg.getBoundingClientRect();
  var y=(e.clientY-r.top)/r.height*H;
  var p=st.geo.P(y);
  if(p>st.geo.hi||p<st.geo.lo) return;

  if(st.tool==='bos'||st.tool==='ext'){
    st.draws.push({k:st.tool,p:p});
    hint('geplaatst — tik nog een niveau of kies een ander gereedschap');
  }else{
    if(st.pend==null){ st.pend=p; hint('tweede punt aantikken'); return; }
    st.draws.push({k:st.tool,a:st.pend,b:p}); st.pend=null; hint(null);
  }
  paintDraws();
}
function paintDraws(){
  var g=host.querySelector('#udraw'); if(!g) return;
  var G=st.geo, o=[];
  st.draws.forEach(function(d){
    if(d.k==='bos'||d.k==='ext'){
      var lab=d.k==='bos'?'BOS':'EXT';
      o.push('<line x1="'+G.PL+'" y1="'+G.Y(d.p).toFixed(1)+'" x2="'+G.RE+'" y2="'+G.Y(d.p).toFixed(1)+'" stroke="var(--tv-draw)" stroke-width="1.2" stroke-dasharray="4 3"/>'+
             '<text x="'+(G.RE-2)+'" y="'+(G.Y(d.p)-4).toFixed(1)+'" text-anchor="end" font-family="\'JetBrains Mono\',monospace" fill="var(--tv-draw)" font-size="8.5" font-weight="700">'+lab+'</text>');
    }else{
      var y1=G.Y(Math.max(d.a,d.b)), y2=G.Y(Math.min(d.a,d.b)), mid=(y1+y2)/2;
      var lab2=d.k==='fibbos'?'0.5 BOS':'0.5';
      o.push('<rect x="'+G.PL+'" y="'+y1.toFixed(1)+'" width="'+(G.RE-G.PL)+'" height="'+(y2-y1).toFixed(1)+'" fill="var(--tv-draw)" opacity=".06"/>'+
             '<line x1="'+G.PL+'" y1="'+mid.toFixed(1)+'" x2="'+G.RE+'" y2="'+mid.toFixed(1)+'" stroke="var(--tv-fib)" stroke-width="1.1" stroke-dasharray="2 3"/>'+
             '<text x="'+(G.RE-2)+'" y="'+(mid-4).toFixed(1)+'" text-anchor="end" font-family="\'JetBrains Mono\',monospace" fill="var(--tv-fib)" font-size="8.5" font-weight="700">'+lab2+'</text>');
    }
  });
  g.innerHTML=o.join('');
}
function hint(txt){
  var el=document.getElementById('hint'); if(el) el.textContent=txt||'';
}

/* ═══════════ ronde ═══════════ */
function load(){
  var s=S[st.i];
  st.tool=null; st.pend=null; st.draws=[]; st.locked=false;
  document.getElementById('num').textContent=('0'+(st.i+1)).slice(-2);
  document.getElementById('titel').textContent='Wat doe je hier?';
  document.getElementById('klok').textContent=s.tijd||'';
  toonContext(s);
  document.getElementById('fbhost').innerHTML='';
  document.querySelectorAll('.tool').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.act').forEach(function(b){b.disabled=false;});
  hint(null); pips();
  build(s,0);
  var i=0, cds=host.querySelectorAll('.cd'), vbs=host.querySelectorAll('.vb');
  (function step(){
    if(i>=s.c.length) return;
    cds[i].style.opacity=1; if(vbs[i]) vbs[i].style.opacity=.85; i++;
    setTimeout(step,95);
  })();
}
function toonContext(s){
  var bias = s.bias || 'bullish', dxy = s.dxy || 'invers';
  var rij = function(k, v, kl){
    return '<div class="ctx-r"><span class="ctx-k">'+k+'</span>'+
           '<span class="ctx-v '+kl+'">'+v+'</span></div>';
  };
  var bk = bias==='bullish' ? 'bull' : bias==='bearish' ? 'bear' : 'warn';
  var dk = dxy==='invers' ? 'ok' : dxy==='unison' ? 'no' : 'warn';
  var dv = dxy==='invers' ? 'invers ✓' : dxy==='unison' ? 'loopt mee' : 'onduidelijk';
  document.getElementById('ctx').innerHTML =
      rij('1H-bias', bias.toUpperCase(), bk)
    + rij('DXY', dv, dk)
    + rij('rebalance', s.rebal ? 'al geraakt' : 'nog open', s.rebal ? 'no' : 'ok');
}

function poortOordeel(s){
  if (s.poort) return s.poort;
  if ((s.bias||'') === 'onduidelijk')
    return 'Hier stopt het al bij <b>poort 2</b>: zonder overtuigende 1H-bias doet de rest van de chart er niet toe.';
  if ((s.dxy||'invers') !== 'invers')
    return 'Hier stopt het bij <b>poort 3</b>: de DXY bevestigt je bias niet op de hogere timeframe.';
  if (s.rebal)
    return 'Hier stopt het bij <b>poort 4</b>: de rebalance is al geweest, dus je target ligt achter je.';
  return 'Bias, DXY en rebalance stonden alle drie groen — dit ging dus over de chart zelf.';
}

function pips(){
  var b=document.getElementById('bar'), o='';
  for(var i=0;i<S.length;i++){
    var c=st.res[i]==null?(i===st.i?'pip now':'pip'):(st.res[i]?'pip ok':'pip no');
    o+='<div class="'+c+'"></div>';
  }
  b.innerHTML=o;
  document.getElementById('score').innerHTML='<b>'+st.score+'</b> / '+st.res.filter(function(x){return x!=null;}).length;
}

function answer(a){
  if(st.locked) return; st.locked=true;
  var s=S[st.i], ok=(a===s.ans);
  st.res[st.i]=ok; if(ok){ st.score++; } else { st.wrong.push(s); }
  document.querySelectorAll('.act').forEach(function(b){b.disabled=true;});
  pips();

  /* onthul de rest + de juiste markeringen */
  var cds=host.querySelectorAll('.cd'), vbs=host.querySelectorAll('.vb'), j=s.c.length;
  (function step(){
    if(j>=cds.length){ marks(s); return; }
    cds[j].style.opacity=1; if(vbs[j]) vbs[j].style.opacity=.85; j++;
    setTimeout(step,120);
  })();

  var NL={buy:'BUY',sell:'SELL',wait:'WAIT OUT'};
  document.getElementById('fbhost').innerHTML=
    '<div class="fb '+(ok?'ok':'no')+'">'+
      '<div class="fb-h"><span class="fb-v">'+(ok?'Goed':'Fout')+'</span>'+
      '<span class="fb-a mono">jij: '+NL[a]+(ok?'':' · juist: '+NL[s.ans])+'</span></div>'+
      '<div class="fb-poort">'+poortOordeel(s)+'</div>'+
      '<p>'+s.why+'</p><span class="ref mono">'+s.ref+'</span></div>'+
    '<button class="next" id="next">'+(st.i===S.length-1?'Bekijk je score':'Volgende chart')+'</button>';
  document.getElementById('next').addEventListener('click',function(){
    st.i++; if(st.i>=S.length) finish(); else load();
  });
}
function marks(s){
  var g=host.querySelector('#reveal'); if(!g) return;
  var G=st.geo, o=[];
  if(s.swing!=null){
    o.push('<line x1="'+G.PL+'" y1="'+G.Y(s.swing).toFixed(1)+'" x2="'+G.RE+'" y2="'+G.Y(s.swing).toFixed(1)+'" stroke="var(--tv-draw)" stroke-width="1.3" stroke-dasharray="4 3"/>'+
           '<text x="'+(G.RE-4)+'" y="'+(G.Y(s.swing)+11).toFixed(1)+'" text-anchor="end" font-family="\'JetBrains Mono\',monospace" fill="var(--tv-draw)" font-size="8.5" font-weight="700">swingpunt</text>');
  }
  if(s.tgt!=null){
    o.push('<line x1="'+G.PL+'" y1="'+G.Y(s.tgt).toFixed(1)+'" x2="'+G.RE+'" y2="'+G.Y(s.tgt).toFixed(1)+'" stroke="var(--tv-fib)" stroke-width="1.4"/>'+
           '<text x="'+(G.RE-2)+'" y="'+(G.Y(s.tgt)+10).toFixed(1)+'" text-anchor="end" font-family="\'JetBrains Mono\',monospace" fill="var(--tv-fib)" font-size="8.5" font-weight="700">target</text>');
  }
  if(s.f50!=null){
    o.push('<line x1="'+G.PL+'" y1="'+G.Y(s.f50).toFixed(1)+'" x2="'+G.RE+'" y2="'+G.Y(s.f50).toFixed(1)+'" stroke="var(--tv-fib)" stroke-width="1.2" stroke-dasharray="2 3"/>'+
           '<text x="'+(G.RE-4)+'" y="'+(G.Y(s.f50)-5).toFixed(1)+'" text-anchor="end" font-family="\'JetBrains Mono\',monospace" fill="var(--tv-fib)" font-size="8.5" font-weight="700">0.5 entry</text>');
  }
  g.innerHTML=o.join('');
}

function finish(){
  document.getElementById('game').hidden=true;
  var e=document.getElementById('einde'); e.hidden=false;
  var n=S.length, sc=st.score;
  var handel=[],wacht=[];
  S.forEach(function(s,i){ (s.ans==='wait'?wacht:handel).push(st.res[i]); });
  var hOk=handel.filter(Boolean).length, wOk=wacht.filter(Boolean).length;

  var kop = sc>=9?'Scherp.' : sc>=7?'Goede basis.' : sc>=5?'Het begint te komen.' : 'Nog even oefenen.';
  var tekst = sc>=9
    ? 'Je leest zowel de setups als de valkuilen. Dit is het niveau waarop de check je nauwelijks meer hoeft te redden.'
    : sc>=7
    ? 'De structuur zie je grotendeels. Loop bij de missers na welke poort je oversloeg — meestal is het poort 2 of poort 4.'
    : 'Neem de guide er nog eens bij, met name de anatomie en de sectie over wat géén shift is. Speel daarna opnieuw.';

  var extra='';
  if(handel.length && wacht.length && wOk===wacht.length && hOk<handel.length){
    extra='<div class="note"><b>Let op:</b> je hebt elke geen-trade goed, maar mist de setups die je wél had moeten nemen. Discipline zit goed, herkenning nog niet — en te vaak wachten kost op de lange termijn net zo goed geld.</div>';
  }else if(handel.length && wacht.length && hOk===handel.length && wOk<wacht.length){
    extra='<div class="note"><b>Let op:</b> je herkent de goede setups, maar drukt te vaak op handelen bij charts die geen trade zijn. Dat is precies het patroon dat je deze week −26,11 kostte.</div>';
  }else if(sc>=9){
    extra='<div class="note"><b>Volgende stap:</b> de winst zit nu niet meer in herkennen, maar in doen wat je herkent — ook na een verlies.</div>';
  }
  var dash=function(a,b){ return b? a+'/'+b : '—'; };

  var mis=st.wrong.slice();
  var slot='<p style="font-size:12.5px;color:var(--text-3);margin:14px 0 0">'+
    (st.drill
      ? 'Herhaalronde van je missers.'
      : 'Deze ronde bevatte '+handel.length+' setups om te nemen en '+wacht.length+' keer wachten — willekeurig getrokken uit negenenvijftig scenario\'s.')+'</p>';
  var drillBtn = mis.length
    ? '<button class="next drill" style="margin-top:16px" id="drill">Alleen je missers opnieuw ('+mis.length+')</button>'
    : '';
  e.innerHTML='<div class="done"><h2>'+kop+'</h2>'+
    '<div class="big mono">'+sc+'/'+n+'</div>'+
    '<p>'+tekst+'</p>'+
    '<div class="grid">'+
      '<div class="cell"><div class="k">Setups herkend</div><div class="v mono">'+dash(hOk,handel.length)+'</div></div>'+
      '<div class="cell"><div class="k">Terecht gewacht</div><div class="v mono">'+dash(wOk,wacht.length)+'</div></div>'+
    '</div>'+extra+
    slot+drillBtn+'<button class="next" style="margin-top:'+(mis.length?'8px':'16px')+'" id="again">Nieuwe ronde</button></div>';
  var d=document.getElementById('drill');
  if(d) d.addEventListener('click',function(){
    S=shuffle(mis);
    st={i:0,score:0,res:[],wrong:[],drill:true,tool:null,pend:null,draws:[],locked:false,geo:null};
    e.hidden=true; document.getElementById('game').hidden=false; load();
  });
  document.getElementById('again').addEventListener('click',function(){
    st={i:0,score:0,res:[],wrong:[],drill:false,tool:null,pend:null,draws:[],locked:false,geo:null};
    S=deal(); e.hidden=true; document.getElementById('game').hidden=false; load();
  });
}

/* ═══════════ knoppen ═══════════ */
document.getElementById('tools').addEventListener('click',function(e){
  var b=e.target.closest('.tool'); if(!b) return;
  var t=b.dataset.t;
  if(t==='wis'){ st.draws=[]; st.pend=null; st.tool=null; hint(null); paintDraws();
    document.querySelectorAll('.tool').forEach(function(x){x.classList.remove('on');}); return; }
  var on=b.classList.contains('on');
  document.querySelectorAll('.tool').forEach(function(x){x.classList.remove('on');});
  st.pend=null; hint(null);
  if(on){ st.tool=null; } else { b.classList.add('on'); st.tool=t;
    hint(t==='bos'||t==='ext'?'tik een niveau aan':'tik twee punten aan'); }
});
document.querySelectorAll('.act').forEach(function(b){
  b.addEventListener('click',function(){ answer(b.dataset.a); });
});

load();
})();
</script>

</body>
